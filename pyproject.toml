[project]
name = "prodml"
version = "0.1.0"
description = "Pet breed classification service (mlops-pet-breed)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "mlflow-skinny==3.17.1",
    "numpy>=1.26",
    "onnxruntime>=1.31.0",
    "pillow>=10",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "torch>=2.1",
    "torchvision>=0.16",
    "uvicorn>=0.27",
]

[project.optional-dependencies]

train = ["pandas>=2", "scikit-learn>=1.3", "matplotlib>=3.8"]

dev = [
    "pytest>=8",
    "pytest-cov",
    "httpx>=0.27",
    "ruff",
    "black",
    "pandas>=2",
    "scikit-learn>=1.3",
    "dvc>=3.67.1",
    "pre-commit>=4.6.2",
    "onnx>=1.23.2",
    "mlflow==3.17.1",
]


[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/prodml --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
