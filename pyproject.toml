[project]
name = "prodml"
version = "0.1.0"
description = "Pet breed classification service (mlops-pet-breed)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2",
    "python-multipart>=0.0.9", 
    "torch>=2.1",
    "torchvision>=0.16",
    "uvicorn>=0.27",
]

[project.optional-dependencies]

train = ["pandas>=2", "scikit-learn>=1.3", "matplotlib>=3.8"]

dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "ruff", "black", "pandas>=2", "scikit-learn>=1.3"]


[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }  

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
