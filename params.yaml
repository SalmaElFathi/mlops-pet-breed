split:
  seed: 42
  val_fraction: 0.2

corruptions:
  blur_radius: [1, 2, 4]
  brightness_up: [1.3, 1.6, 2.0]
  brightness_down: [0.7, 0.5, 0.3]
  jpeg_quality: [60, 30, 10]
  downscale_side: [160, 96, 64]
  motion_length: [5, 9, 15]

calibration:
  abstention_threshold: 0.7

train:
  backbone: resnet50
  lr: 0.001
  batch_size: 32
  epochs: 5
  seed: 42
  image_size: 224
  resize_size: 256